name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libx11-dev

      - name: Build
        run: make -j"$(nproc)"

      - name: Regression tests
        run: make test

      - name: Headless smoke test
        run: ./rpgcpp --headless --frames 1200

      - name: Screenshot smoke test
        run: ./rpgcpp --screenshot /tmp/aetheria-shots
