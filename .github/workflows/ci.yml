name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libx11-dev

      - name: Build
        run: make -j"$(nproc)"

      - name: Regression tests
        run: make test

      - name: Headless smoke test
        run: ./rpgcpp --headless --frames 1200

      - name: Screenshot smoke test
        run: ./rpgcpp --screenshot /tmp/aetheria-shots

  windows:
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            git
            make
            mingw-w64-x86_64-gcc

      - name: Build
        run: make -j"$(nproc)"

      - name: Regression tests
        run: make test

      - name: Headless smoke test
        run: ./rpgcpp.exe --headless --frames 1200

      - name: Screenshot smoke test
        run: ./rpgcpp.exe --screenshot /tmp/aetheria-shots

      - name: Installer smoke test
        run: |
          dest="$(cygpath -u "$RUNNER_TEMP")/aetheria-install"
          repo="$(cygpath -u "$GITHUB_WORKSPACE")"
          ./install.sh --yes --dir "$dest" --repo "$repo"
          test -f "$dest/rpgcpp.exe"
          test -f "$dest/Aetheria.bat"
          "$dest/rpgcpp.exe" --headless --frames 60
